[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Processo 1: Servidor HTTP (Laravel)
; ---------------------------------------------------------------------------
[program:laravel-web]
command=php artisan serve --host=0.0.0.0 --port=%(ENV_PORT)s
directory=/var/www
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ---------------------------------------------------------------------------
; Processo 2: Horizon (worker de fila — substitui queue:work simples)
; ---------------------------------------------------------------------------
[program:laravel-horizon]
command=php artisan horizon
directory=/var/www
autostart=true
autorestart=true
startretries=5
stopwaitsecs=30
stopsignal=SIGTERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; ---------------------------------------------------------------------------
; Processo 3: Scheduler (cron interno do Laravel — necessário para o heartbeat)
; ---------------------------------------------------------------------------
[program:laravel-scheduler]
command=/bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
