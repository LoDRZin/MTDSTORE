name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─── GATE 1: Env Safety — blocks deploy before anything else ────────────────
  env-safety-check:
    name: "🔒 Env Safety Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "❌ Fail if NEXT_PUBLIC_* points to localhost"
        run: |
          echo "Checking for localhost in public env vars..."
          FAIL=0
          for envfile in frontend/.env frontend/.env.production; do
            if [ -f "$envfile" ]; then
              if grep -qE "NEXT_PUBLIC_[A-Z_]+=.*localhost" "$envfile"; then
                echo "❌ BLOCKED: $envfile contains NEXT_PUBLIC_* pointing to localhost:"
                grep -E "NEXT_PUBLIC_[A-Z_]+=.*localhost" "$envfile"
                FAIL=1
              fi
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "Fix: clear the value or move it to .env.local (gitignored)"
            exit 1
          fi
          echo "✅ No NEXT_PUBLIC_* localhost variables found."

      - name: "❌ Fail if real .env files are tracked in git"
        run: |
          echo "Checking for committed .env files..."
          committed=$(git ls-tree -r HEAD --name-only | grep -E "^(frontend|backend)/\.env$" || true)
          if [ -n "$committed" ]; then
            echo "❌ BLOCKED: real .env committed: $committed"
            echo "Run: git rm --cached <file>"
            exit 1
          fi
          echo "✅ No real .env files tracked in git."

  backend-tests:
    needs: env-safety-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mtdstore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_pgsql, mbstring, exif, pcntl, bcmath, gd, zip, redis
        coverage: pcov

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: backend/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Dependencies
      working-directory: ./backend
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Prepare Laravel Application
      working-directory: ./backend
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Pest Tests with Coverage Gate
      working-directory: ./backend
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: mtdstore_test
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: |
        php artisan migrate:fresh --env=testing
        # Aqui definimos o min de cobertura (ex: 80) e forçamos o erro se não bater
        ./vendor/bin/pest --coverage --min=80

  frontend-lint:
    needs: env-safety-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

  # ─── GATE 2: Frontend build must pass on CI with empty NEXT_PUBLIC_API_URL ──
  frontend-build:
    name: "🔨 Frontend Build Validation"
    needs: env-safety-check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: TypeScript check
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Build (with empty API URL to validate relative-path strategy)
      working-directory: ./frontend
      run: npm run build
      env:
        # Must stay empty — any localhost value here would be caught by env-safety-check above
        NEXT_PUBLIC_API_URL: ""
        REVALIDATION_SECRET: "ci-test-secret"
